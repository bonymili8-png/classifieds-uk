<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="description" content="ОголошенняUK — безкоштовні оголошення для українців у Великій Британії: робота, житло, послуги, речі, підвезення." />
  <title>ОголошенняUK — оголошення для українців у Британії</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />

  <meta property="og:title" content="ОголошенняUK — оголошення для українців у Британії" />
  <meta property="og:description" content="Робота, житло, послуги, речі та підвезення для української спільноти в UK." />
  <meta property="og:type" content="website" />
</head>
<body>
  <!-- Шапка -->
  <header class="app-header" id="appHeader">
    <div class="container header-inner">
      <a class="brand" href="#/" data-link aria-label="На головну">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7z" opacity=".15"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 2 3 7v10l9 5 9-5V7z"/><path fill="currentColor" d="M7 11h10v2H7zm0 4h7v2H7z"/></svg>
        </span>
        <span class="brand-text">Оголошення<b>UK</b></span>
      </a>

      <form class="search" id="searchForm" role="search">
        <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m21 21-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"/></svg>
        <input type="search" id="searchInput" placeholder="Пошук оголошень…" autocomplete="off" />
        <button type="submit" class="search-btn">Знайти</button>
      </form>

      <div class="header-actions">
        <button class="icon-btn lang-btn" id="langBtn" title="EN / UA" aria-label="Language">EN</button>
        <button class="icon-btn" id="themeBtn" title="Змінити тему" aria-label="Змінити тему">
          <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-13V1m0 22v-3m8-8h3M1 12h3m13.7 6.7 2 2M3.3 3.3l2 2m13.4 0 2-2M3.3 20.7l2-2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <div class="auth-area" id="authArea"></div>
        <a class="btn btn-primary add-btn" href="#/new" data-link>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="nav.add">Додати</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Контент -->
  <main id="view" class="view"></main>

  <!-- Нижня навігація (мобільна) -->
  <nav class="tabbar" id="tabbar">
    <a href="#/" data-link class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="1.8" d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav.home">Головна</span>
    </a>
    <a href="#/saved" data-link class="tab" data-tab="saved">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span data-i18n="nav.saved">Збережені</span>
    </a>
    <a href="#/new" data-link class="tab tab-cta" data-tab="new">
      <span class="tab-cta-circle"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="none" stroke="currentColor" stroke-width="2.2" d="M12 5v14M5 12h14"/></svg></span>
      <span data-i18n="nav.add">Додати</span>
    </a>
    <a href="#/chats" data-link class="tab" data-tab="chats" style="position:relative">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M21 11.5a8.4 8.4 0 0 1-12 7.6L3 21l1.9-6A8.4 8.4 0 1 1 21 11.5Z"/></svg>
      <span class="nav-badge" id="tabUnread" hidden></span>
      <span data-i18n="nav.chats">Чати</span>
    </a>
    <a href="#/profile" data-link class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9a7 7 0 0 1 14 0"/></svg>
      <span data-i18n="nav.profile">Профіль</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
