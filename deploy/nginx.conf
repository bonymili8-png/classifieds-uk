# nginx — зворотний проксі з HTTPS для ОголошенняUK.
#
# Передумови:
#   • Застосунок працює на 127.0.0.1:3000 (node server.js / docker compose).
#   • Сертифікат отримано через certbot:
#       sudo certbot certonly --nginx -d example.com -d www.example.com
#   • Замініть example.com на свій домен.
#
# Покладіть цей файл у /etc/nginx/sites-available/ogoloshennia і зробіть symlink
# у sites-enabled, потім:  sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Шлях для оновлення сертифікатів certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (заголовки безпеки рівня застосунку додає сам Node).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Фото надсилаються як base64 у JSON — піднімаємо ліміт тіла.
    client_max_body_size 25M;

    # Стиснення.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Довге кешування для завантажених фото та іконок (вони незмінні).
    location ~ ^/(uploads|icons)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
